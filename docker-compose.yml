services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: econova
      POSTGRES_USER: econova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    volumes:
      - econova_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U econova -d econova"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://econova:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}@db:5432/econova
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY to a unique random value of at least 32 characters}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      PROVIDER_HTTP_LOCAL_ADDRESS: ${PROVIDER_HTTP_LOCAL_ADDRESS:-0.0.0.0}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  econova_data:
